<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epson Authorization - MS Xerox</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            max-width: 400px;
        }
        h1 { color: #d4af37; font-size: 22px; }
        p { color: #cbd5e1; font-size: 14px; }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #d4af37;
            color: #000000;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Authorization Successful!</h1>
        <p>Your Epson printer has been linked to MS Xerox.</p>
        <p>Returning to the MS Xerox app...</p>
        <a id="app-link" class="btn" href="#">Open MS Xerox App</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        if (code) {
            const appDeepLink = `com.mukeshsaw.msxerox://epson-callback?code=${code}`;
            document.getElementById('app-link').href = appDeepLink;
            // Auto redirect back to Android App
            window.location.href = appDeepLink;
        }
    </script>
</body>
</html>
