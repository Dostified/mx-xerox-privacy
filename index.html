<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epson Connect Cloud Printing Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #22c55e;
            --error-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        h2 {
            margin-top: 0;
            color: var(--accent-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .section {
            margin-bottom: 20px;
            padding: 15px;
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input[type="text"], input[type="file"], select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #1e293b;
            color: var(--text-color);
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        .status-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            background: #000;
            border: 1px solid var(--border-color);
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.85rem;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .badge-success { background: var(--success-color); color: #000; }
        .badge-danger { background: var(--error-color); color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h2>Epson Connect Print Manager</h2>

    <!-- Step 1: OAuth Authentication -->
    <div class="section">
        <label>1. Authentication Status</label>
        <span id="auth-status" class="badge badge-danger">Not Authenticated</span>
        <button id="btn-login" onclick="startOAuthFlow()">Login with Epson Connect</button>
    </div>

    <!-- Step 2: Print Settings & File Upload -->
    <div class="section">
        <label>2. Select File (PDF / Image)</label>
        <input type="file" id="file-input" accept="application/pdf,image/jpeg,image/png">

        <label>Paper Size</label>
        <select id="media-size">
            <option value="ms_a4">A4</option>
            <option value="ms_letter">Letter</option>
        </select>

        <label>Color Mode</label>
        <select id="color-mode">
            <option value="color">Color</option>
            <option value="mono">Monochrome (B&W)</option>
        </select>

        <label>Copies</label>
        <input type="text" id="copies" value="1">
    </div>

    <!-- Step 3: Print Action -->
    <button id="btn-print" onclick="executeFullPrintFlow()" disabled>Send Print Command</button>

    <!-- Execution Status Log -->
    <div class="status-box" id="log-output">System initialized. Awaiting user login...</div>
</div>

<script>
    const CONFIG = {
        CLIENT_ID: "d39337b5d4a74e2aa7b06601320d4599",
        CLIENT_SECRET: "p4o2g1P0eZemvqJhQ4RWHLBEbJHPi2TlT13Q2-yaxDuzd5zoXCv0m_MOQiUmrnyNc3mcM6UfvuJUn_-pbYGmnQ",
        API_KEY: "6eT07O78GN7qxBvGaFE4P6VKDcesQZr51f8HuA6f",
        REDIRECT_URI: "https://dostified.github.io/mx-xerox-privacy/index.html",
        AUTH_URL: "https://auth.epsonconnect.com/auth/authorize",
        TOKEN_URL: "https://auth.epsonconnect.com/auth/token",
        API_BASE_URL: "https://api.epsonconnect.com/api/1/printing"
    };

    let accessToken = null;
    let subjectId = null;

    function log(msg) {
        const box = document.getElementById('log-output');
        box.innerText += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
        box.scrollTop = box.scrollHeight;
    }

    function startOAuthFlow() {
        const cleanUri = encodeURIComponent(CONFIG.REDIRECT_URI.trim());
        const authUrl = `${CONFIG.AUTH_URL}?response_type=code&client_id=${CONFIG.CLIENT_ID}&redirect_uri=${cleanUri}&scope=device`;
        log("Redirecting to Epson Login...");
        window.location.href = authUrl;
    }

    async function handleAuthCallback() {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');

        if (error) {
            log("Authentication Rejected: " + error);
            return;
        }

        if (code) {
            log("Authorization code detected. Exchanging for Access Token...");
            
            // Clear code parameter from URL bar without reloading
            window.history.replaceState({}, document.title, window.location.pathname);

            try {
                const credentials = `${CONFIG.CLIENT_ID}:${CONFIG.CLIENT_SECRET}`;
                const authHeader = "Basic " + btoa(credentials);

                const bodyData = new URLSearchParams();
                bodyData.append("grant_type", "authorization_code");
                bodyData.append("code", code.trim());
                bodyData.append("redirect_uri", CONFIG.REDIRECT_URI.trim());

                const response = await fetch(CONFIG.TOKEN_URL, {
                    method: "POST",
                    headers: {
                        "Authorization": authHeader,
                        "x-api-key": CONFIG.API_KEY,
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: bodyData
                });

                const data = await response.json();

                if (response.ok && data.access_token) {
                    accessToken = data.access_token;
                    subjectId = data.subject_id;

                    // Update UI State
                    const statusBadge = document.getElementById('auth-status');
                    statusBadge.innerText = "Authenticated";
                    statusBadge.className = "badge badge-success";

                    document.getElementById('btn-login').style.display = "none";
                    document.getElementById('btn-print').disabled = false;

                    log("AUTH SUCCESS! Printer Device Linked Successfully.");
                } else {
                    log("Token Exchange Failed (" + response.status + "): " + JSON.stringify(data));
                }
            } catch (err) {
                log("Network / CORS Error during Token Exchange: " + err.message);
            }
        }
    }

    async function executeFullPrintFlow() {
        const fileInput = document.getElementById('file-input');
        if (!fileInput.files.length) {
            alert("Kripya ek file select karein!");
            return;
        }

        const file = fileInput.files[0];
        document.getElementById('btn-print').disabled = true;

        try {
            log("1/3 Creating Print Job...");
            const jobRes = await fetch(`${CONFIG.API_BASE_URL}/jobs`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${accessToken}`,
                    "x-api-key": CONFIG.API_KEY,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    job_name: file.name,
                    print_mode: file.type.includes("pdf") ? "document" : "photo",
                    print_setting: {
                        media_size: document.getElementById('media-size').value,
                        media_type: "mt_plainpaper",
                        color_mode: document.getElementById('color-mode').value,
                        copies: parseInt(document.getElementById('copies').value) || 1
                    }
                })
            });

            const jobData = await jobRes.json();
            if (!jobRes.ok) throw new Error("Job Creation Failed: " + JSON.stringify(jobData));

            const jobId = jobData.id;
            const uploadUri = jobData.upload_uri;
            log(`Job Created! ID: ${jobId}`);

            log("2/3 Uploading File Data...");
            const uploadRes = await fetch(`${uploadUri}&File=1.${file.name.split('.').pop()}`, {
                method: "POST",
                headers: { "Content-Type": "application/octet-stream" },
                body: file
            });

            if (!uploadRes.ok) throw new Error("Upload Failed");
            log("File Data Uploaded!");

            log("3/3 Triggering Print Execution...");
            const execRes = await fetch(`${CONFIG.API_BASE_URL}/jobs/${jobId}/print`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${accessToken}`,
                    "x-api-key": CONFIG.API_KEY,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({})
            });

            if (execRes.ok) {
                log("SUCCESS: Document Sent to Printer Output Tray!");
                alert("Print Command Successfully Delivered!");
            } else {
                const execData = await execRes.json();
                throw new Error("Execution Failed: " + JSON.stringify(execData));
            }
        } catch (err) {
            log("ERROR: " + err.message);
        } finally {
            document.getElementById('btn-print').disabled = false;
        }
    }

    window.onload = handleAuthCallback;
</script>

</body>
</html>
